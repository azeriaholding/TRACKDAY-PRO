<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackDay PRO — Ingeniería de Pista</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════════
     TRACKDAY PRO — PADDOCK VISIBILITY MODE
     Diseñado para: sol directo · pantallas 200-400 nits · guantes
     Inspirado en: Race Technology Cloud / MoTec dash aesthetics
     ════════════════════════════════════════════════════════════ */
  :root {
    /* FONDOS — más claros = más contraste en reflexión de luz */
    --bg-primary:   #0d1117;   /* fondo base — carbono oscuro */
    --bg-secondary: #161b24;   /* sidebar / topbar */
    --bg-card:      #1c2333;   /* tarjetas */
    --bg-elevated:  #242e42;   /* inputs / stat blocks */
    --bg-highlight: #2d3a52;   /* hover states */

    /* BORDES — visibles, no decorativos */
    --border:        #344560;
    --border-bright: #4a5f80;
    --border-active: #6b8ab0;

    /* ACENTOS — saturación máxima para pantallas de baja luminosidad */
    --red:     #ff2d44;   /* rojo semáforo, visible a plena luz */
    --red-dim: #7a1020;
    --orange:  #ff8c00;   /* naranja ámbar — máximo contraste sobre oscuro */
    --orange-dim: #7a4000;
    --yellow:  #ffe040;   /* amarillo neón — color primario de DATOS */
    --green:   #00ff88;   /* verde néon — OK / correcto */
    --cyan:    #00cfff;   /* cian — datos secundarios / info */
    --white:   #ffffff;
    --blue:    #4d9fff;   /* azul info */

    /* TEXTO — jerarquía de contraste estricta */
    --text-primary:   #e8eeff;   /* casi blanco — para datos principales */
    --text-secondary: #b0bdd4;   /* gris claro — para labels, visible siempre */
    --text-dim:       #6a7a96;   /* gris medio — solo ornamental */

    /* GLOWS — presentes pero contenidos */
    --glow-red:    0 0 14px rgba(255,45,68,0.55);
    --glow-orange: 0 0 14px rgba(255,140,0,0.55);
    --glow-yellow: 0 0 14px rgba(255,224,64,0.45);
    --glow-green:  0 0 14px rgba(0,255,136,0.45);
    --glow-cyan:   0 0 14px rgba(0,207,255,0.45);

    /* Aliases para compatibilidad */
    --accent-glow:  var(--glow-red);
    --orange-glow:  var(--glow-orange);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle carbon-fiber grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg,   transparent, transparent 39px, rgba(74,95,128,0.12) 40px),
      repeating-linear-gradient(90deg,  transparent, transparent 39px, rgba(74,95,128,0.12) 40px);
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; }

  /* ── LAYOUT ──────────────────────────────── */
  .app-layout { display: flex; min-height: 100vh; }

  /* ── SIDEBAR ─────────────────────────────── */
  .sidebar {
    width: 220px;
    background: var(--bg-secondary);
    border-right: 2px solid var(--border-bright);
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 18px 16px 14px;
    border-bottom: 2px solid var(--border-bright);
    background: linear-gradient(160deg, #0d1117 0%, #1c2333 100%);
  }
  .logo-title {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 900;
    color: var(--red);
    letter-spacing: 2px;
    text-shadow: var(--glow-red);
    line-height: 1;
  }
  .logo-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    letter-spacing: 3px;
    margin-top: 5px;
  }
  .logo-line {
    height: 2px;
    background: linear-gradient(90deg, var(--red), var(--orange) 40%, transparent);
    margin-top: 12px;
    border-radius: 1px;
  }
  .sidebar-nav { flex: 1; padding: 10px 0; overflow-y: auto; }
  .nav-section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--text-dim);
    padding: 12px 16px 4px;
    text-transform: uppercase;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    color: var(--text-secondary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.12s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover {
    color: var(--white);
    background: rgba(255,255,255,0.05);
    border-left-color: var(--border-active);
  }
  .nav-item.active {
    color: var(--yellow);
    background: rgba(255,224,64,0.09);
    border-left-color: var(--yellow);
    text-shadow: var(--glow-yellow);
  }
  .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
  .sidebar-footer {
    padding: 12px 16px;
    border-top: 2px solid var(--border-bright);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    letter-spacing: 1px;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    box-shadow: 0 0 8px var(--green);
    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green { 0%,100%{opacity:1} 50%{opacity:0.45} }

  /* ── TOPBAR ───────────────────────────────── */
  .main-content { margin-left: 220px; flex: 1; min-height: 100vh; }
  .topbar {
    height: 52px;
    background: var(--bg-secondary);
    border-bottom: 2px solid var(--border-bright);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--text-secondary);
  }
  .topbar-divider { flex: 1; }
  .topbar-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--border-bright);
    color: var(--text-secondary);
    letter-spacing: 1px;
  }
  .page-content { padding: 20px 24px; }

  /* ── CARDS ────────────────────────────────── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-bright);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  /* Acento de color en borde superior — 3px para visibilidad */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--orange) 0%, rgba(255,140,0,0.3) 60%, transparent 100%);
  }
  .card-red::before   { background: linear-gradient(90deg, var(--red) 0%, rgba(255,45,68,0.3) 60%, transparent); }
  .card-green::before { background: linear-gradient(90deg, var(--green) 0%, rgba(0,255,136,0.3) 60%, transparent); }
  .card-cyan::before  { background: linear-gradient(90deg, var(--cyan) 0%, rgba(0,207,255,0.3) 60%, transparent); }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--orange);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .card-title.red   { color: var(--red); }
  .card-title.green { color: var(--green); }
  .card-title.cyan  { color: var(--cyan); }

  /* ── GRID ─────────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }
  .gap-16 { gap: 16px; } .mb-12 { margin-bottom: 12px; }
  .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
  .flex { display: flex; } .flex-col { flex-direction: column; }
  .items-center { align-items: center; } .justify-between { justify-content: space-between; }
  .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }

  /* ── INPUTS — grandes para guantes ────────── */
  .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .input-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .input-field {
    background: var(--bg-elevated);
    border: 1px solid var(--border-bright);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.12s, box-shadow 0.12s;
    width: 100%;
  }
  .input-field:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 2px rgba(255,140,0,0.25);
  }
  .input-field option { background: var(--bg-card); color: var(--white); }
  .input-number {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    text-align: center;
    color: var(--yellow);
    font-weight: 700;
  }

  /* ── BUTTONS ──────────────────────────────── */
  .btn {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 13px 22px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px; /* touch target */
  }
  .btn-primary  { background: var(--red);   color: var(--white); border: 2px solid var(--red); }
  .btn-primary:hover  { background: #ff4d60; box-shadow: var(--glow-red); }
  .btn-secondary{ background: transparent;  color: var(--orange); border: 2px solid var(--orange); }
  .btn-secondary:hover{ background: rgba(255,140,0,0.12); }
  .btn-ghost    { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-bright); }
  .btn-ghost:hover{ color: var(--white); border-color: var(--border-active); }

  /* ── DATA DISPLAY — el corazón de la app ──── */
  /* Regla: datos importantes = AMARILLO siempre */
  .data-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 32px;
    color: var(--yellow);
    line-height: 1;
    text-shadow: var(--glow-yellow);
    font-weight: 700;
  }
  .data-value.red   { color: var(--red);   text-shadow: var(--glow-red); }
  .data-value.green { color: var(--green); text-shadow: var(--glow-green); }
  .data-value.cyan  { color: var(--cyan);  text-shadow: var(--glow-cyan); }
  .data-value.white { color: var(--white); text-shadow: none; }
  .data-value.large { font-size: 46px; }
  /* Labels de datos: secondary, nunca dim */
  .data-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .data-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    margin-left: 4px;
  }

  /* ── STAT BLOCK ────────────────────────────── */
  .stat-block {
    background: var(--bg-elevated);
    border: 1px solid var(--border-bright);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: border-color 0.12s;
  }
  .stat-block:hover { border-color: var(--border-active); }

  /* ── BADGES — sólidos, visibles en sol ─────── */
  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    display: inline-flex;
    align-items: center;
    border-radius: 2px;
    line-height: 1.4;
  }
  .badge-red    { background: rgba(255,45,68,0.25);  color: #ff7080; border: 1px solid rgba(255,45,68,0.6); }
  .badge-orange { background: rgba(255,140,0,0.22);  color: var(--orange); border: 1px solid rgba(255,140,0,0.55); }
  .badge-yellow { background: rgba(255,224,64,0.18); color: var(--yellow); border: 1px solid rgba(255,224,64,0.5); }
  .badge-green  { background: rgba(0,255,136,0.15);  color: var(--green); border: 1px solid rgba(0,255,136,0.45); }
  .badge-cyan   { background: rgba(0,207,255,0.14);  color: var(--cyan); border: 1px solid rgba(0,207,255,0.45); }
  .badge-gray   { background: rgba(176,189,212,0.12);color: var(--text-secondary); border: 1px solid var(--border-bright); }

  /* ── SETUP ROWS ────────────────────────────── */
  .sep { border: none; border-top: 1px solid var(--border-bright); margin: 16px 0; }
  .setup-block { border: 1px solid var(--border-bright); padding: 16px; background: var(--bg-elevated); }
  .setup-block-title {
    font-family: 'Orbitron', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    color: var(--text-secondary); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .setup-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border-bright);
    font-size: 15px; gap: 8px;
  }
  .setup-row:last-child { border-bottom: none; }
  .setup-param { color: var(--text-secondary); font-weight: 600; flex: 1; font-size: 15px; }
  .setup-val {
    font-family: 'Share Tech Mono', monospace;
    color: var(--yellow); font-size: 15px; font-weight: 700; text-align: right;
  }
  .setup-change-positive { color: var(--green) !important; }
  .setup-change-negative { color: var(--red)   !important; }

  /* ── CIRCUIT CARDS ─────────────────────────── */
  .circuit-card {
    background: var(--bg-card);
    border: 1px solid var(--border-bright);
    padding: 16px; cursor: pointer;
    transition: all 0.12s; position: relative; overflow: hidden;
  }
  .circuit-card::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    opacity: 0; transition: opacity 0.12s;
  }
  .circuit-card:hover { border-color: var(--orange); background: rgba(255,140,0,0.06); }
  .circuit-card:hover::after { opacity: 1; }
  .circuit-card.selected { border-color: var(--yellow); background: rgba(255,224,64,0.07); }
  .circuit-card.selected::after { opacity:1; background: linear-gradient(90deg,transparent,var(--yellow),transparent); }
  .circuit-name { font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:700; color:var(--white); }
  .circuit-meta { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:1px; margin-top:4px; }

  /* ── PROBLEM CHIPS ─────────────────────────── */
  .problem-chip {
    padding: 10px 12px;
    border: 1px solid var(--border-bright);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.12s;
  }
  .problem-chip:hover { border-color: var(--orange); color: var(--white); background: rgba(255,140,0,0.09); }
  .problem-chip.selected {
    border-color: var(--red); color: var(--white);
    background: rgba(255,45,68,0.16);
    box-shadow: inset 0 0 0 1px var(--red), 0 0 8px rgba(255,45,68,0.3);
  }

  /* ── ALERTS ────────────────────────────────── */
  .alert { border: 1px solid var(--border-bright); padding: 13px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .alert-warning { border-color: rgba(255,140,0,0.65); background: rgba(255,140,0,0.11); }
  .alert-danger  { border-color: rgba(255,45,68,0.65); background: rgba(255,45,68,0.11); }
  .alert-success { border-color: rgba(0,255,136,0.5);  background: rgba(0,255,136,0.09); }
  .alert-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .alert-text { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; line-height:1.45; color:var(--text-primary); }

  /* ── TIEMPO BANDS ──────────────────────────── */
  .tiempo-band { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-bright); }
  .tiempo-band:last-child { border-bottom:none; }
  .tiempo-level { font-family:'Share Tech Mono',monospace; font-size:11px; font-weight:700; letter-spacing:1px; width:85px; color:var(--text-secondary); }
  .tiempo-bar { flex:1; height:6px; background:var(--bg-elevated); border:1px solid var(--border-bright); overflow:hidden; }
  .tiempo-bar-fill { height:100%; }
  .tiempo-value { font-family:'Share Tech Mono',monospace; font-size:16px; font-weight:700; width:60px; text-align:right; }

  /* ── SPEED TABLE ───────────────────────────── */
  .speed-table { width:100%; border-collapse:collapse; }
  .speed-table th {
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px;
    color:var(--text-secondary); text-transform:uppercase;
    padding:9px 10px; text-align:left;
    border-bottom:2px solid var(--border-bright); background:var(--bg-elevated);
  }
  .speed-table td { padding:11px 10px; border-bottom:1px solid var(--border-bright); font-size:15px; font-weight:600; color:var(--text-primary); }
  .speed-table tr:hover td { background:rgba(255,224,64,0.04); }
  .speed-table .gear-num { font-family:'Orbitron',monospace; font-size:22px; font-weight:900; color:var(--yellow); width:48px; }
  .speed-table .speed-val { font-family:'Share Tech Mono',monospace; font-size:17px; color:var(--white); font-weight:700; }

  /* ── PROGRESS + MISC ───────────────────────── */
  .progress-bar { height:5px; background:var(--bg-elevated); border:1px solid var(--border-bright); overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--orange),var(--red)); transition:width 0.5s ease; }
  .circuit-svg-container { background:var(--bg-elevated); border:1px solid var(--border-bright); display:flex; align-items:center; justify-content:center; padding:20px; min-height:200px; }
  .setup-saved-card { background:var(--bg-card); border:1px solid var(--border-bright); padding:16px; position:relative; overflow:hidden; transition:all 0.12s; }
  .setup-saved-card:hover { border-color:var(--orange); }
  .setup-saved-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--orange); }
  .metric-row { display:flex; align-items:baseline; gap:6px; }

  /* SAG VISUAL */
  .sag-visual { display:flex; flex-direction:column; align-items:center; padding:20px; background:var(--bg-elevated); border:1px solid var(--border-bright); gap:8px; }
  .sag-bar-container { width:60px; height:200px; background:var(--bg-primary); border:1px solid var(--border-bright); position:relative; overflow:hidden; }
  .sag-bar-fill { position:absolute; bottom:0; width:100%; background:linear-gradient(0deg,var(--orange),var(--red)); transition:height 0.5s ease; }
  .sag-marker { position:absolute; width:100%; height:1px; background:rgba(255,255,255,0.35); left:0; }
  .sag-marker-label { position:absolute; right:-35px; font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-secondary); transform:translateY(-50%); }

  /* TOOLTIP */
  .custom-tooltip { background:var(--bg-card); border:1px solid var(--border-bright); padding:10px 14px; font-family:'Share Tech Mono',monospace; font-size:12px; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:5px; height:5px; }
  ::-webkit-scrollbar-track { background:var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background:var(--border-bright); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--orange); }

  /* ANIMATION */
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.22s ease; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { width: 64px; }
    .sidebar .logo-title, .sidebar .logo-sub, .sidebar .logo-line,
    .sidebar .nav-section-label, .nav-item span:not(.nav-icon), .sidebar-footer span { display: none; }
    .nav-item { justify-content: center; padding: 14px; }
    .main-content { margin-left: 64px; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .sidebar { width: 0; overflow: hidden; }
    .main-content { margin-left: 0; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
</style>
</head>

// Calcula tiempos trackday reales a partir del récord de vuelta.
// Factores calibrados con referencia real de Navarra (dato piloto real):
// record=86s → Pro TD=1:48(108s) / Avanzado=2:03(123s) / Intermedio=2:10(130s) / Iniciado=2:20(140s)
// Factores: x1.26 / x1.43 / x1.51 / x1.63  (trackday aficionado, NO campeonato)
function calcularTiempos(record_s) {
  const fmt = (s) => {
    const m = Math.floor(s / 60);
    const ss = Math.round(s % 60);
    return `${m}:${ss.toString().padStart(2,'0')}`;
  };
  return {
    pro:        fmt(Math.round(record_s * 1.26)),
    avanzado:   fmt(Math.round(record_s * 1.43)),
    intermedio: fmt(Math.round(record_s * 1.51)),
    iniciado:   fmt(Math.round(record_s * 1.63)),
  };
}

function calcularPresion(neumatico, moto, tempAmb, tempAsp, uso) {
  if (!neumatico || !moto) return null;
  const TRACKDAY_OFFSET = -0.10; // corrección realista para trackday
  let p = neumatico.p_base_frio + TRACKDAY_OFFSET;
  // Ajuste temperatura ambiente
  if (tempAmb < 15) p += 0.15;
  else if (tempAmb < 20) p += 0.08;
  else if (tempAmb >= 35) p -= 0.08;
  else if (tempAmb >= 28) p -= 0.04;
  // Ajuste temperatura asfalto
  if (tempAsp < 20) p += 0.08;
  else if (tempAsp >= 45) p -= 0.10;
  else if (tempAsp >= 38) p -= 0.05;
  // Ajuste peso moto
  if (moto.peso_kg > 205) p += 0.05;
  if (moto.peso_kg < 185) p -= 0.03;
  // Ajuste uso
  if (uso === 'Carrera') p -= 0.05;
  else if (uso === 'Calle') p += 0.20;
  // Mínimos por tipo de neumático
  const minP = neumatico.tipo?.includes('Slick') ? 1.5 : 1.7;
  return Math.max(minP, Math.min(2.8, +p.toFixed(2)));
}

function calcularSag(altDescargada, altConMoto, altConPiloto) {
  const sagEstatico = altConMoto - altConPiloto;
  const sagDinamico = altDescargada - altConPiloto;
  return { sagEstatico, sagDinamico };
}

function parseTireSpec(specStr) {
  // Parse "190/55 ZR17", "120/70 R19", "200/60 ZR17" etc
  // [A-Z]* skips all speed-rating letters (ZR, Z, R, B...) before the rim number
  const m = specStr.replace(/\s/g,'').match(/^(\d+)\/(\d+)[A-Z]*([\d]+)/i);
  if (!m) return { width:180, aspect:55, rim:17 };
  return { width:+m[1], aspect:+m[2], rim:+m[3] };
}

function tireCircumferenceM(specStr) {
  const { width, aspect, rim } = parseTireSpec(specStr);
  const rimMM = rim * 25.4;
  const sidewall = width * (aspect / 100);
  return Math.PI * (rimMM + 2 * sidewall) / 1000; // meters
}

function calcularVelocidades(moto, pinonCustom, coronaCustom) {
  const p = pinonCustom || moto.desarrollo.pinon;
  const c = coronaCustom || moto.desarrollo.corona;
  const relFinal = c / p;
  const circ = tireCircumferenceM(moto.rueda_tras); // real tire circumference

  return moto.desarrollo.relaciones.map((rel, i) => {
    const relTotal = moto.desarrollo.rel_primaria * rel * relFinal;
    // v(km/h) = (RPM / ratio) * circ(m) * 60min/h / 1000m/km
    const vMax   = (moto.desarrollo.rpm_max / relTotal) * circ * 60 / 1000;
    const v8000  = (8000 / relTotal) * circ * 60 / 1000;
    const v5000  = (5000 / relTotal) * circ * 60 / 1000;
    const vPer1k = (1000  / relTotal) * circ * 60 / 1000;
    return {
      marcha:  i + 1,
      relTotal: relTotal.toFixed(3),
      vPer1k:   +vPer1k.toFixed(1),
      v5000:    Math.round(v5000),
      v8000:    Math.round(v8000),
      vMax:     Math.round(vMax),
    };
  });
}

    estoril:      { d: "M 265,125 L 265,68 Q 265,44 242,34 L 190,26 Q 164,22 148,38 L 130,58 Q 112,78 88,86 L 58,92 Q 36,98 36,118 L 36,130 Q 36,148 60,150 L 238,150 Q 265,148 265,125 Z", label: 'Estoril' },
    portimao:     { d: "M 46,140 L 192,140 Q 224,140 244,122 L 268,96 Q 280,76 270,54 L 248,36 Q 222,22 192,28 L 155,36 Q 128,44 112,64 L 90,90 Q 70,108 52,122 Z", label: 'Portimão' },
    calafat:      { d: "M 55,118 L 188,118 Q 210,118 215,100 L 216,78 Q 213,60 197,52 L 168,46 Q 145,44 132,58 L 116,76 Q 100,90 80,96 L 60,100 Q 48,104 50,114 Z", label: 'Calafat' },
    jarama:       { d: "M 48,128 L 210,128 Q 238,128 248,108 L 254,84 Q 255,60 235,46 L 200,34 Q 174,26 152,36 L 130,50 Q 110,66 92,82 L 68,104 Q 50,118 48,128 Z", label: 'Jarama' },

  };
  const shape = shapes[circuit.id] || shapes.jarama;
  // Start/finish line: find a good point on the path (approximate bottom-left)
  const startX = 50, startY = 140;
  return (
    <svg viewBox="0 0 320 170" style={{width:'100%',maxWidth:'320px',height:'auto'}}>
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="320" height="170" fill="transparent"/>
      {/* Track base shadow */}
      <path d={shape.d} fill="none" stroke="#1a2030" strokeWidth="22" strokeLinecap="round" strokeLinejoin="round"/>
      {/* Track surface */}
      <path d={shape.d} fill="none" stroke="#252c3a" strokeWidth="18" strokeLinecap="round" strokeLinejoin="round"/>
      {/* Racing line */}

      {/* Start/finish */}
      <line x1={startX} y1={startY-10} x2={startX} y2={startY+10} stroke="#00d46a" strokeWidth="3"/>
      <circle cx={startX} cy={startY} r="4" fill="#00d46a" filter="url(#glow)"/>
      {/* Label */}
      <text x="160" y="165" textAnchor="middle" fill="rgba(122,132,153,0.6)" fontSize="9" fontFamily="Share Tech Mono" letterSpacing="2">{shape.label.toUpperCase()}</text>
    </svg>
  );
};

// SAG
const Sag = () => {
  // Mediciones independientes por eje
  const [axis, setAxis] = useState('trasero');

  // TRASERO
  const [tL1, setTL1] = useState(320); // L1 extensión máxima (moto en caballete)
  const [tL2, setTL2] = useState(308); // L2 con peso moto (sin piloto)
  const [tL3, setTL3] = useState(288); // L3 con piloto equipado

  // DELANTERO
  const [dL1, setDL1] = useState(560); // L1 extensión máxima
  const [dL2, setDL2] = useState(545); // L2 con peso moto
  const [dL3, setDL3] = useState(530); // L3 con piloto

  const isTras = axis === 'trasero';

  const L1 = isTras ? tL1 : dL1;
  const L2 = isTras ? tL2 : dL2;
  const L3 = isTras ? tL3 : dL3;
  const setL1 = isTras ? setTL1 : setDL1;
  const setL2 = isTras ? setTL2 : setDL2;
  const setL3 = isTras ? setTL3 : setDL3;

  // FÓRMULAS CORRECTAS (según manual de ingeniería)
  // SAG Estático = L1 - L2  (hundimiento por peso de la moto)
  // SAG Dinámico = L1 - L3  (hundimiento total con piloto equipado)
  const sagEstat = L1 - L2;
  const sagDin   = L1 - L3;
  // Recorrido libre = L2 - L3 (cuánto hunde el piloto sobre la moto)
  const recorrido = L2 - L3;

  // RANGOS CORRECTOS según especificación técnica
  const ref = isTras
    ? { estatMin: 5,  estatMax: 15, dinMin: 30, dinMax: 40,
        recMin: 20, recMax: 30, name: 'TRASERO',
        tipL1: '320', tipL2: '308', tipL3: '288',
        descL1: 'Moto en caballete, rueda libre', descL3: 'Piloto en posición de conducción' }
    : { estatMin: 20, estatMax: 30, dinMin: 25, dinMax: 35,
        recMin: 10, recMax: 20, name: 'DELANTERO',
        tipL1: '560', tipL2: '545', tipL3: '530',
        descL1: 'Horquilla extendida, rueda libre', descL3: 'Piloto con peso sobre el manillar' };

  const estatOk = sagEstat >= ref.estatMin && sagEstat <= ref.estatMax;
  const dinOk   = sagDin   >= ref.dinMin   && sagDin   <= ref.dinMax;

  // Diagnóstico completo con lógica correcta de precarga
  const diagnostico = () => {
    const msgs = [];
    // SAG estático
    if (sagEstat < ref.estatMin) {
      msgs.push({ type: 'warning', icon: '🔺', title: 'SAG estático demasiado pequeño', msg: `Mide ${sagEstat}mm, mínimo ${ref.estatMin}mm. La moto está demasiado alta/rígida. → DISMINUYE la precarga (afloja el ajustador del muelle).` });
    } else if (sagEstat > ref.estatMax) {
      msgs.push({ type: 'warning', icon: '🔻', title: 'SAG estático demasiado grande', msg: `Mide ${sagEstat}mm, máximo ${ref.estatMax}mm. La moto se hunde demasiado. → AUMENTA la precarga (aprieta el ajustador del muelle).` });
    } else {
      msgs.push({ type: 'success', icon: '✅', title: 'SAG estático correcto', msg: `${sagEstat}mm dentro del rango ${ref.estatMin}–${ref.estatMax}mm. Continúa con la verificación dinámica.` });
    }
    // SAG dinámico
    if (sagDin < ref.dinMin) {
      msgs.push({ type: 'warning', icon: '⚠️', title: 'SAG dinámico escaso', msg: `Mide ${sagDin}mm, mínimo ${ref.dinMin}mm. El muelle es demasiado duro para el peso del piloto, o la precarga es excesiva. → Reduce precarga o considera muelle más blando.` });
    } else if (sagDin > ref.dinMax) {
      msgs.push({ type: 'danger', icon: '🚨', title: 'SAG dinámico excesivo', msg: `Mide ${sagDin}mm, máximo ${ref.dinMax}mm. El muelle es demasiado blando para el peso del piloto. → Aumenta precarga o considera muelle más duro (distinta constante k).` });
    } else {
      msgs.push({ type: 'success', icon: '✅', title: 'SAG dinámico correcto', msg: `${sagDin}mm dentro del rango ${ref.dinMin}–${ref.dinMax}mm.` });
    }
    // Consistencia: si ambos están bien
    if (estatOk && dinOk) {
      msgs.push({ type: 'success', icon: '🏁', title: '¡Setup correcto!', msg: `SAG ${ref.name} dentro de todos los rangos. Geometría óptima para trackday.` });
    } else if (!estatOk && !dinOk) {
      msgs.push({ type: 'danger', icon: '⚙️', title: 'Revisar constante de muelle', msg: 'No es posible conseguir ambos SAG simultáneamente. Es probable que necesites cambiar los muelles por unos de distinta constante elástica.' });
    }
    return msgs;
  };

  const diags = diagnostico();

  const totalRango = isTras ? 60 : 60; // mm de escala visual

  const dinPct    = Math.min(100, Math.max(0, (sagDin   / totalRango) * 100));
  const minEPct   = (ref.estatMin / totalRango) * 100;
  const maxEPct   = (ref.estatMax / totalRango) * 100;
  const minDPct   = (ref.dinMin   / totalRango) * 100;
  const maxDPct   = (ref.dinMax   / totalRango) * 100;

  return (
    <div className="page-content fade-in">
      <div style={{fontFamily:'Orbitron',fontSize:'14px',fontWeight:'700',letterSpacing:'3px',color:'var(--text-secondary)',marginBottom:'20px'}}>📐 CÁLCULO DE SAG — PROCEDIMIENTO TÉCNICO</div>

      <div className="grid-2">

          {/* Selector eje */}
          <div className="card">
            <div className="card-title">SELECCIONAR EJE</div>
            <div style={{display:'flex',gap:'8px'}}>
              {['trasero','delantero'].map(a => (
                <button key={a} className={`btn ${axis===a?'btn-primary':'btn-ghost'}`}
                  onClick={()=>setAxis(a)} style={{flex:1,justifyContent:'center',fontSize:'12px'}}>
                  {a === 'trasero' ? '🔴 TRASERO' : '🔵 DELANTERO'}
                </button>
              ))}
            </div>
          </div>

          {/* Procedimiento visual */}
          <div className="card" style={{background:'rgba(255,107,0,0.04)',border:'1px solid var(--orange-dim)'}}>
            <div className="card-title">📋 PROCEDIMIENTO DE MEDICIÓN</div>
            <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
              {[
                { step:'1', label:'MEDIDA L1 — Extensión máxima', color:'var(--text-secondary)', desc: ref.descL1 + '. Rueda en el aire.' },
                { step:'2', label:'MEDIDA L2 — SAG estático', color:'var(--orange)', desc:'Moto en el suelo, vertical, SIN piloto. Mide el mismo punto.' },
                { step:'3', label:'MEDIDA L3 — SAG dinámico', color:'var(--red)', desc: ref.descL3 + '. Moto en el suelo.' },
              ].map(s => (
                <div key={s.step} style={{display:'flex',gap:'10px',alignItems:'flex-start'}}>
                  <div style={{fontFamily:'Orbitron',fontSize:'18px',fontWeight:'900',color:s.color,width:'24px',flexShrink:0,lineHeight:'1'}}>{s.step}</div>
                  <div>
                    <div style={{fontFamily:'Share Tech Mono',fontSize:'10px',letterSpacing:'2px',color:s.color}}>{s.label}</div>
                    <div style={{fontSize:'12px',color:'var(--text-secondary)',marginTop:'2px',lineHeight:'1.4'}}>{s.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Inputs de medición */}
          <div className="card">
            <div className="card-title">INTRODUCE TUS MEDIDAS — {ref.name}</div>
            <div className="input-group">
              <label className="input-label">
                L1 — Extensión máxima (moto en caballete) mm
              </label>
              <input type="number" className="input-field input-number" value={L1}
                onChange={e=>setL1(+e.target.value)} min={100} max={800}
                placeholder={ref.tipL1}/>
            </div>
            <div className="input-group">
              <label className="input-label">
                L2 — Con peso moto, sin piloto mm
              </label>
              <input type="number" className="input-field input-number" value={L2}
                onChange={e=>setL2(+e.target.value)} min={100} max={800}
                placeholder={ref.tipL2}/>
            </div>
            <div className="input-group">
              <label className="input-label">
                L3 — Con piloto equipado en posición mm
              </label>
              <input type="number" className="input-field input-number" value={L3}
                onChange={e=>setL3(+e.target.value)} min={100} max={800}
                placeholder={ref.tipL3}/>
            </div>

            {/* Fórmulas live */}
            <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',padding:'12px',marginTop:'8px'}}>
              <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',letterSpacing:'2px',color:'var(--text-secondary)',marginBottom:'10px'}}>FÓRMULAS EN VIVO</div>
              <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontFamily:'Share Tech Mono',fontSize:'11px',color:'var(--text-secondary)'}}>SAG Estático = L1 − L2</span>
                  <span style={{fontFamily:'Share Tech Mono',fontSize:'13px',color:'var(--orange)',fontWeight:'700'}}>{L1} − {L2} = <strong style={{fontSize:'16px'}}>{sagEstat}mm</strong></span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontFamily:'Share Tech Mono',fontSize:'11px',color:'var(--text-secondary)'}}>SAG Dinámico = L1 − L3</span>
                  <span style={{fontFamily:'Share Tech Mono',fontSize:'13px',color:'var(--red)',fontWeight:'700'}}>{L1} − {L3} = <strong style={{fontSize:'16px'}}>{sagDin}mm</strong></span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',opacity:0.6}}>
                  <span style={{fontFamily:'Share Tech Mono',fontSize:'11px',color:'var(--text-secondary)'}}>Peso piloto = L2 − L3</span>
                  <span style={{fontFamily:'Share Tech Mono',fontSize:'12px',color:'var(--text-secondary)'}}>{L2} − {L3} = {recorrido}mm</span>
                </div>
              </div>
            </div>
          </div>

          {/* Rangos */}
          <div className="card">
            <div className="card-title">RANGOS TÉCNICOS — {ref.name}</div>
            <div className="grid-2">
              <div className="stat-block">
                <div className="data-label">SAG ESTÁTICO</div>
                <div style={{fontFamily:'Share Tech Mono',color:'var(--orange)',fontSize:'16px',marginTop:'6px',fontWeight:'700'}}>{ref.estatMin}–{ref.estatMax} mm</div>
                <div style={{fontSize:'11px',color:'var(--text-secondary)',marginTop:'4px',lineHeight:'1.3'}}>Peso moto en reposo sobre el suelo. Ajustar primero.</div>
              </div>
              <div className="stat-block">
                <div className="data-label">SAG DINÁMICO</div>
                <div style={{fontFamily:'Share Tech Mono',color:'var(--red)',fontSize:'16px',marginTop:'6px',fontWeight:'700'}}>{ref.dinMin}–{ref.dinMax} mm</div>
                <div style={{fontSize:'11px',color:'var(--text-secondary)',marginTop:'4px',lineHeight:'1.3'}}>Con piloto equipado. Verificar tras ajuste estático.</div>
              </div>
            </div>
          </div>
        </div>

        {/* RIGHT: resultados */}
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>

          {/* Resultado visual principal */}
          <div className="card">
            <div className="card-title">RESULTADO — {ref.name}</div>

            {/* Barra visual comparativa */}
            <div style={{padding:'8px 0 16px'}}>
              <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--text-secondary)',letterSpacing:'2px',marginBottom:'12px'}}>COMPARATIVA VISUAL</div>
              <svg viewBox="0 0 320 110" style={{width:'100%',height:'110px'}}>
                {/* Background scale */}
                <rect x="60" y="10" width="220" height="30" rx="3" fill="var(--bg-elevated)" stroke="var(--border)" strokeWidth="1"/>

                {/* Estático: zona OK */}
                <rect x={60 + (minEPct/100)*220} y="10" width={((maxEPct-minEPct)/100)*220} height="30" rx="2" fill="rgba(0,212,106,0.15)" stroke="rgba(0,212,106,0.4)" strokeWidth="1"/>
                {/* Estático: valor actual */}
                <rect x="60" y="10" width={Math.min(220,(estatPct/100)*220)} height="30" rx="2" fill={estatOk ? 'rgba(0,212,106,0.5)' : 'rgba(255,107,0,0.5)'}/>
                <text x="65" y="30" fill="white" fontSize="10" fontFamily="Share Tech Mono" fontWeight="700">SAG EST: {sagEstat}mm</text>

        )}
      </div>
    </div>
  );
};

// Radar / Spider chart SVG — compara setup BASE vs AJUSTADO
const RadarChart = ({ base, adjusted, labels }) => {
  const N = labels.length;
  const cx = 110, cy = 105, r = 75;
  const angles = labels.map((_,i) => (i * 2 * Math.PI / N) - Math.PI / 2);
  const pt = (val, maxVal, angle) => {
    const ratio = Math.min(1, Math.max(0, val / maxVal));
    return [cx + r * ratio * Math.cos(angle), cy + r * ratio * Math.sin(angle)];
  };
  const polygon = (vals, maxVals) => vals.map((v,i) => pt(v, maxVals[i], angles[i]).join(',')).join(' ');
  const maxVals = labels.map(() => 20);
  const gridLevels = [0.25, 0.5, 0.75, 1.0];

  return (
    <svg viewBox="0 0 220 210" style={{width:'100%',maxWidth:'220px',height:'210px'}}>
      {/* Grid polygons */}
      {gridLevels.map((lvl,gi) => (
        <polygon key={gi}
          points={angles.map(a => [cx + r*lvl*Math.cos(a), cy + r*lvl*Math.sin(a)].join(',')).join(' ')}
          fill="none" stroke="var(--border)" strokeWidth="0.5" opacity="0.5"/>
      ))}
      {/* Axes */}
      {angles.map((a,i) => (
        <line key={i} x1={cx} y1={cy} x2={cx + r*Math.cos(a)} y2={cy + r*Math.sin(a)}
          stroke="var(--border)" strokeWidth="0.5" opacity="0.4"/>
      ))}
      {/* Base polygon */}
      <polygon points={polygon(base, maxVals)}
        fill="rgba(255,107,0,0.15)" stroke="var(--orange)" strokeWidth="1.5" opacity="0.7"/>
      {/* Adjusted polygon */}
      <polygon points={polygon(adjusted, maxVals)}
        fill="rgba(232,0,28,0.2)" stroke="var(--red)" strokeWidth="2" strokeDasharray="4,2"/>
      {/* Labels */}
      {labels.map((lbl,i) => {
        const [lx, ly] = [cx + (r+14)*Math.cos(angles[i]), cy + (r+14)*Math.sin(angles[i])];
        return <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
          fill="var(--text-secondary)" fontSize="8" fontFamily="Share Tech Mono">{lbl}</text>;
      })}
      {/* Center label */}
      <text x={cx} y={cy-4} textAnchor="middle" fill="var(--text-secondary)" fontSize="7" fontFamily="Share Tech Mono">BASE</text>
      {/* Legend */}
      <line x1="8" y1="196" x2="22" y2="196" stroke="var(--orange)" strokeWidth="1.5"/>
      <text x="25" y="199" fill="var(--text-secondary)" fontSize="7" fontFamily="Share Tech Mono">Base</text>
      <line x1="65" y1="196" x2="79" y2="196" stroke="var(--red)" strokeWidth="2" strokeDasharray="4,2"/>
      <text x="82" y="199" fill="var(--text-secondary)" fontSize="7" fontFamily="Share Tech Mono">Ajustado</text>
    </svg>
  );
};

// ── MAIN SUSPENSION COMPONENT ───────────────────────────────────
const Suspension = () => {
  const [motoId, setMotoId]   = useState('');
  const [peso, setPeso]       = useState(75);
  const [problema, setProblema] = useState('');

  const moto      = MOTOS.find(m => m.id === motoId);
  const pesoTotal = moto ? peso + moto.peso_kg : peso + 195;

  // Detect HS/LS capable suspension from bike's susp description
  const hasHSLS = moto && (
    moto.susp_del?.toLowerCase().includes('bff') ||
    moto.susp_tras?.toLowerCase().includes('bfrc') ||
    moto.susp_del?.toLowerCase().includes('öhlins') ||
    moto.susp_del?.toLowerCase().includes('ohlins') ||
    moto.susp_del?.toLowerCase().includes('ttx') ||
    moto.susp_del?.toLowerCase().includes('sachs')
  );

  // Base setup calculated from total weight
  const clamp = (v, lo=1, hi=20) => Math.max(lo, Math.min(hi, Math.round(v)));
  const base = {
    precarga_del:  clamp(((pesoTotal * 0.45) / 100) * 12, 0, 30),
    comp_ls_del:   clamp(10 + (pesoTotal - 250) / 32),
    comp_hs_del:   clamp(14 + (pesoTotal - 250) / 28),
    rebote_ls_del: clamp(8  + (pesoTotal - 250) / 36),
    rebote_hs_del: clamp(12 + (pesoTotal - 250) / 30),
    precarga_tras: clamp(((pesoTotal * 0.55) / 100) * 15, 0, 30),
    comp_ls_tras:  clamp(12 + (pesoTotal - 250) / 26),
    comp_hs_tras:  clamp(16 + (pesoTotal - 250) / 22),
    rebote_ls_tras:clamp(10 + (pesoTotal - 250) / 32),
    rebote_hs_tras:clamp(14 + (pesoTotal - 250) / 28),
  };

  // Problem-specific delta corrections (clics)
  const DELTAS = {
    subviraje:          { comp_ls_del:-2, rebote_ls_del:-1, precarga_tras:-2, comp_ls_tras:0 },
    sobreviraje:        { comp_ls_tras:-2, precarga_tras:+3, rebote_ls_del:+1 },
    hundimiento_frenada:{ comp_ls_del:+3, comp_hs_del:+1, precarga_del:+5, rebote_ls_del:+2 },
    rebote_salida:      { rebote_ls_tras:+2, comp_ls_tras:+1, rebote_hs_tras:+1 },
    falta_traccion:     { rebote_ls_tras:-3, comp_ls_tras:-2, precarga_tras:-2 },
    flaneo_alta_velocidad:{ comp_hs_tras:+2, comp_hs_del:+2, comp_ls_del:+1, comp_ls_tras:+1 },
  };

  const delta = problema ? (DELTAS[problema] || {}) : {};

  const adj = Object.fromEntries(
    Object.keys(base).map(k => [k, clamp((base[k]||0) + (delta[k]||0), 0, 28)])
  );

  // Radar data: 6 axes — [Comp Del, Reb Del, Prec Del, Comp Tras, Reb Tras, Prec Tras]
  const radarBase = [base.comp_ls_del, base.rebote_ls_del, base.precarga_del, base.comp_ls_tras, base.rebote_ls_tras, base.precarga_tras];
  const radarAdj  = [adj.comp_ls_del,  adj.rebote_ls_del,  adj.precarga_del,  adj.comp_ls_tras,  adj.rebote_ls_tras,  adj.precarga_tras];
  const radarLabels = ['C.DEL','R.DEL','PRE.D','C.TRS','R.TRS','PRE.T'];

  const problemas = [
    { id:'subviraje',           icon:'↩', label:'SUBVIRAJE',          desc:'Moto no gira, va recto',       afecta:'del' },
    { id:'sobreviraje',         icon:'↪', label:'SOBREVIRAJE',        desc:'Trasero se va',                afecta:'tras' },
    { id:'hundimiento_frenada', icon:'⬇', label:'HUNDIMIENTO FRENADA',desc:'Horquilla se clava',           afecta:'del' },
    { id:'rebote_salida',       icon:'🔀', label:'REBOTE SALIDA',      desc:'Bote al acelerar',             afecta:'tras' },
    { id:'falta_traccion',      icon:'🔴', label:'FALTA TRACCIÓN',     desc:'Rueda trasera patina',         afecta:'tras' },
    { id:'flaneo_alta_velocidad',icon:'〰',label:'FLANEO / WEAVE',    desc:'Oscilación en recta',          afecta:'both' },
  ];

  // Cause-effect explanation per problem
  const CAUSA_EFECTO = {
    subviraje:          { causa:'Demasiada carga en el tren delantero. La horquilla está muy dura o la precarga trasera es excesiva.', efecto:'Abriendo la compresión delantera y reduciendo precarga trasera liberamos el eje delantero para que entre a la curva.' },
    sobreviraje:        { causa:'El trasero se colapsa o rebota con demasiada energía al salir de la curva.', efecto:'Abriendo la compresión trasera y aumentando precarga el tren trasero gana estabilidad lateral.' },
    hundimiento_frenada:{ causa:'La horquilla no tiene suficiente resistencia a la compresión bajo la fuerza de frenado.', efecto:'Cerrando la compresión LS (baja velocidad) controlamos la transferencia de peso sin sacrificar absorción de baches.' },
    rebote_salida:      { causa:'El amortiguador trasero devuelve energía demasiado rápido al acelerar, haciendo botar la moto.', efecto:'Cerrando el rebote trasero el amortiguador recupera más lentamente, manteniendo la rueda en el suelo.' },
    falta_traccion:     { causa:'El trasero está demasiado duro o con exceso de precarga. La rueda no sigue el suelo.', efecto:'Abriendo rebote y compresión trasera y reduciendo precarga la rueda puede trabajar con más libertad.' },
    flaneo_alta_velocidad:{ causa:'La moto oscila a alta velocidad por falta de amortiguación a alta frecuencia.', efecto:'Cerrando la compresión de alta velocidad (HS) en ambos extremos se estabiliza la moto a velocidades elevadas.' },
  };

  // Which sliders changed
  const changed = Object.keys(delta).filter(k => delta[k] !== 0);

  return (
    <div className="page-content fade-in">
      <div style={{fontFamily:'Orbitron',fontSize:'14px',fontWeight:'700',letterSpacing:'3px',color:'var(--text-secondary)',marginBottom:'20px'}}>🔧 SETUP SUSPENSIONES — ENGINEER TOOL</div>

      {/* ── ROW 1: Config + Diagnosis ── */}
      <div className="grid-2" style={{marginBottom:'12px'}}>

        {/* Config */}
        <div className="card">
          <div className="card-title">CONFIGURACIÓN BASE</div>
          <div className="input-group">
            <label className="input-label">Moto</label>
            <select className="input-field" value={motoId} onChange={e=>setMotoId(e.target.value)}>
              <option value="">— Seleccionar moto —</option>
              {['RR / Superbike','Supersport','Naked','Trail'].map(cat => {
                const motas = MOTOS.filter(m => {
                  if (cat==='RR / Superbike') return m.categoria.toLowerCase().includes('superbike');
                  if (cat==='Supersport') return m.categoria.toLowerCase().includes('supersport');
                  if (cat==='Naked') return m.categoria.toLowerCase().includes('naked');
                  if (cat==='Trail') return m.categoria.toLowerCase().includes('trail');
                  return false;
                });
                if (!motas.length) return null;
                return <optgroup key={cat} label={cat}>{motas.map(m=><option key={m.id} value={m.id}>{m.marca} {m.modelo} ({m.año})</option>)}</optgroup>;

            <label className="input-label">Peso piloto equipado (kg)</label>

              onChange={e=>setPeso(+e.target.value)} min={50} max={130}/>

          <div className="grid-3" style={{marginTop:'8px'}}>
            <div className="stat-block" style={{textAlign:'center'}}>
              <div className="data-label">TOTAL</div>
              <div className="data-value" style={{fontSize:'22px'}}>{pesoTotal}<span className="data-unit" style={{fontSize:'11px'}}>kg</span></div>
            </div>
            <div className="stat-block" style={{textAlign:'center',gridColumn:'span 2'}}>
              <div className="data-label">SUSP. DEL</div>
              <div style={{fontFamily:'Share Tech Mono',fontSize:'10px',color: hasHSLS?'var(--green)':'var(--orange)',marginTop:'4px',lineHeight:'1.4'}}>
                {moto ? moto.susp_del : '—'}

                <span style={{fontSize:'10px',color:'var(--text-secondary)',fontFamily:'Share Tech Mono'}}>{p.desc}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── ROW 2: Moto ghost + Radar ── */}
      {motoId && (
        <div className="card" style={{marginBottom:'12px'}}>
          <div className="grid-2" style={{alignItems:'center',gap:'16px'}}>
            <div>
              <div className="card-title" style={{marginBottom:'8px'}}>🏍️ VISUALIZACIÓN DINÁMICA{problema ? ' — ' + problemas.find(p=>p.id===problema)?.label : ''}</div>
              <MotoSilhouette problema={problema}/>
              {problema && CAUSA_EFECTO[problema] && (
                <div style={{marginTop:'10px',display:'flex',flexDirection:'column',gap:'8px'}}>
                  <div style={{background:'rgba(255,107,0,0.08)',border:'1px solid rgba(255,107,0,0.25)',padding:'10px',fontSize:'11px',lineHeight:'1.5'}}>
                    <span style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--orange)',display:'block',marginBottom:'3px',letterSpacing:'1px'}}>🔍 CAUSA</span>
                    {CAUSA_EFECTO[problema].causa}
                  </div>
                  <div style={{background:'rgba(0,212,106,0.06)',border:'1px solid rgba(0,212,106,0.2)',padding:'10px',fontSize:'11px',lineHeight:'1.5'}}>
                    <span style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--green)',display:'block',marginBottom:'3px',letterSpacing:'1px'}}>✅ EFECTO DEL AJUSTE</span>
                    {CAUSA_EFECTO[problema].efecto}
                  </div>

            <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
              <div className="card-title" style={{marginBottom:'4px',textAlign:'center'}}>📊 RADAR — BASE vs AJUSTADO</div>

  const circum      = moto ? (tireCircumferenceM(moto.rueda_tras) * 1000).toFixed(0) : '—';

                  );
                })}
              </select>
            </div>

            {moto && (
              <div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'6px',marginBottom:'12px',marginTop:'4px'}}>

                      <div style={{fontFamily:'Share Tech Mono',fontSize:'15px',fontWeight:'700',color:'var(--cyan)'}}>{s.val}</div>

                        <div style={{fontFamily:'Share Tech Mono',fontSize:'8px',color:'var(--text-secondary)',marginBottom:'3px'}}>{i+1}a MARCHA</div>
                        <div style={{fontFamily:'Share Tech Mono',fontSize:'18px',fontWeight:'700',color:'var(--yellow)'}}>{v}</div>
                        <div style={{fontFamily:'Share Tech Mono',fontSize:'8px',color:'var(--text-dim)'}}>km/h</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Speed chart SVG */}
              <div className="card" style={{padding:'16px'}}>
                <div className="card-title">GRAFICO VELOCIDADES</div>
                <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--text-secondary)',letterSpacing:'1px',marginBottom:'12px'}}>
                  Rojo = v.max | Naranja = 8K rpm | Cyan = 5K rpm
                </div>
                <div style={{overflowX:'auto'}}>
                  {(() => {
                    const W = velocidades.length * 60 + 50;
                    const H = 200;
                    const baseY = 172;
                    const maxBar = 155;
                    return (
                      <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',minWidth:'320px',height:H+'px'}}>
                        {velocidades.map((v,i) => {
                          const x = i * 60 + 25;
                          const h1 = Math.round((v.vMax   / maxV) * maxBar);
                          const h2 = Math.round((v.v8000  / maxV) * maxBar);
                          const h3 = Math.round((v.v5000  / maxV) * maxBar);
                          const isActive = activeGear === v.marcha;
                          return (
                            <g key={v.marcha} onClick={() => setActiveGear(activeGear===v.marcha?null:v.marcha)} style={{cursor:'pointer'}}>
                              <rect x={x}    y={baseY-h1} width={16} height={h1} fill={isActive?'#ff2d44':'rgba(232,0,28,0.8)'} rx="1"/>
                              <rect x={x+17} y={baseY-h2} width={12} height={h2} fill="rgba(255,107,0,0.7)" rx="1"/>
                              <rect x={x+30} y={baseY-h3} width={12} height={h3} fill="rgba(0,207,255,0.6)" rx="1"/>
                              <text x={x+8} y={baseY+12} textAnchor="middle" fill={isActive?'#ff2d44':'#7a8499'} fontSize="10" fontFamily="Share Tech Mono">{v.marcha}</text>
                              <text x={x+8} y={baseY-h1-4} textAnchor="middle" fill="rgba(232,0,28,0.9)" fontSize="9" fontFamily="Share Tech Mono">{v.vMax}</text>
                            </g>
                          );
                        })}
                        <line x1="20" y1={baseY} x2={W-10} y2={baseY} stroke="#2a3040" strokeWidth="1"/>
                        <rect x="20" y="8" width="10" height="7" fill="rgba(232,0,28,0.8)" rx="1"/>
                        <text x="34" y="15" fill="#7a8499" fontSize="9" fontFamily="Share Tech Mono">V.MAX</text>
                        <rect x="80" y="8" width="10" height="7" fill="rgba(255,107,0,0.7)" rx="1"/>
                        <text x="94" y="15" fill="#7a8499" fontSize="9" fontFamily="Share Tech Mono">8K</text>
                        <rect x="115" y="8" width="10" height="7" fill="rgba(0,207,255,0.6)" rx="1"/>
                        <text x="129" y="15" fill="#7a8499" fontSize="9" fontFamily="Share Tech Mono">5K</text>
                      </svg>
                    );
                  })()}
                </div>
              </div>
            </div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'350px',color:'var(--text-secondary)',fontFamily:'Share Tech Mono',letterSpacing:'2px',fontSize:'11px',gap:'16px'}}>
              <span style={{fontSize:'48px',opacity:0.2}}>⚙️</span>
              <span>SELECCIONA UNA MOTO</span>
              <span style={{fontSize:'9px',color:'var(--text-dim)',letterSpacing:'1px',textAlign:'center',maxWidth:'200px',lineHeight:'1.6'}}>Calculo con circunferencia real del neumatico segun medida homologada</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

const Setups = () => {
  const [setups, setSetups] = useState(() => JSON.parse(localStorage.getItem('td_setups') || '[]'));
  const [form, setForm] = useState({ nombre: '', motoId: '', circuitId: '', presionDel: '', presionTras: '', compDel: '', reboteDel: '', compTras: '', reboteTras: '', piñon: '', corona: '', notas: '' });
  const [saving, setSaving] = useState(false);
  
  const save = () => {
    if (!form.nombre) return;
    const nuevo = { ...form, id: Date.now(), fecha: new Date().toLocaleDateString('es-ES') };
    const nuevos = [...setups, nuevo];
    setSetups(nuevos);
    localStorage.setItem('td_setups', JSON.stringify(nuevos));
    setForm({ nombre: '', motoId: '', circuitId: '', presionDel: '', presionTras: '', compDel: '', reboteDel: '', compTras: '', reboteTras: '', piñon: '', corona: '', notas: '' });
    setSaving(false);
  };
  
  const del = (id) => {
    const nuevos = setups.filter(s => s.id !== id);
    setSetups(nuevos);
    localStorage.setItem('td_setups', JSON.stringify(nuevos));
  };
  
  const exportar = (s) => {
    const moto = MOTOS.find(m => m.id === s.motoId);
    const circ = CIRCUITS.find(c => c.id === s.circuitId);
    const txt = `=== TRACKDAY PRO SETUP ===\nNombre: ${s.nombre}\nFecha: ${s.fecha}\nMoto: ${moto ? moto.marca + ' ' + moto.modelo : s.motoId}\nCircuito: ${circ ? circ.nombre : s.circuitId}\n\nNEUMÁTICOS\nDelantero: ${s.presionDel} bar\nTrasero: ${s.presionTras} bar\n\nSUSPENSIÓN DELANTERA\nCompresión: ${s.compDel} clics\nRebote: ${s.reboteDel} clics\n\nSUSPENSIÓN TRASERA\nCompresión: ${s.compTras} clics\nRebote: ${s.reboteTras} clics\n\nDESARROLLO\nPiñón: ${s.piñon} | Corona: ${s.corona}\n\nNOTAS\n${s.notas}\n=== FIN SETUP ===`;
    const blob = new Blob([txt], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `setup_${s.nombre.replace(/\s/g,'_')}.txt`;
    a.click();
  };

  return (
    <div className="page-content fade-in">
      <div style={{fontFamily:'Orbitron',fontSize:'14px',fontWeight:'700',letterSpacing:'3px',color:'var(--text-secondary)',marginBottom:'20px'}}>💾 MIS SETUPS</div>
      <div className="grid-2">
        <div>
          <div className="card">
            <div className="card-title">NUEVO SETUP</div>
            <div className="input-group">
              <label className="input-label">Nombre del setup *</label>
              <input className="input-field" placeholder="Ej: Jerez mayo SC2" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})}/>
            </div>
            <div className="input-group">
              <label className="input-label">Moto</label>
              <select className="input-field" value={form.motoId} onChange={e=>setForm({...form,motoId:e.target.value})}>
                <option value="">— Seleccionar —</option>
                {['RR / Superbike','Supersport','Naked','Trail'].map(cat => {
                  const motas = MOTOS.filter(m => {
                    if (cat==='RR / Superbike') return m.categoria.toLowerCase().includes('superbike');
                    if (cat==='Supersport') return m.categoria.toLowerCase().includes('supersport');
                    if (cat==='Naked') return m.categoria.toLowerCase().includes('naked');
                    if (cat==='Trail') return m.categoria.toLowerCase().includes('trail');
                    return false;
                  });
                  if (!motas.length) return null;
                  return <optgroup key={cat} label={cat}>{motas.map(m=><option key={m.id} value={m.id}>{m.marca} {m.modelo}</option>)}</optgroup>;
                })}
              </select>
            </div>
            <div className="input-group">
              <label className="input-label">Circuito</label>
              <select className="input-field" value={form.circuitId} onChange={e=>setForm({...form,circuitId:e.target.value})}>
                <option value="">— Seleccionar —</option>
                {CIRCUITS.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </div>
            <div className="grid-2">
              <div className="input-group">
                <label className="input-label">Presión Del. (bar)</label>
                <input className="input-field input-number" type="number" step="0.05" placeholder="2.20" value={form.presionDel} onChange={e=>setForm({...form,presionDel:e.target.value})}/>
              </div>
              <div className="input-group">
                <label className="input-label">Presión Tras. (bar)</label>
                <input className="input-field input-number" type="number" step="0.05" placeholder="1.85" value={form.presionTras} onChange={e=>setForm({...form,presionTras:e.target.value})}/>
              </div>
            </div>
            <div className="grid-2">
              <div className="input-group">
                <label className="input-label">Comp. Del.</label>
                <input className="input-field input-number" placeholder="12 clics" value={form.compDel} onChange={e=>setForm({...form,compDel:e.target.value})}/>
              </div>
              <div className="input-group">
                <label className="input-label">Rebote Del.</label>
                <input className="input-field input-number" placeholder="10 clics" value={form.reboteDel} onChange={e=>setForm({...form,reboteDel:e.target.value})}/>
              </div>
            </div>
            <div className="grid-2">
              <div className="input-group">
                <label className="input-label">Comp. Tras.</label>
                <input className="input-field input-number" placeholder="14 clics" value={form.compTras} onChange={e=>setForm({...form,compTras:e.target.value})}/>
              </div>
              <div className="input-group">
                <label className="input-label">Rebote Tras.</label>
                <input className="input-field input-number" placeholder="12 clics" value={form.reboteTras} onChange={e=>setForm({...form,reboteTras:e.target.value})}/>
              </div>
            </div>
            <div className="grid-2">
              <div className="input-group">
                <label className="input-label">Piñón</label>
                <input className="input-field input-number" placeholder="16" value={form.piñon} onChange={e=>setForm({...form,piñon:e.target.value})}/>
              </div>
              <div className="input-group">
                <label className="input-label">Corona</label>
                <input className="input-field input-number" placeholder="45" value={form.corona} onChange={e=>setForm({...form,corona:e.target.value})}/>
              </div>
            </div>
            <div className="input-group">
              <label className="input-label">Notas</label>
              <textarea className="input-field" rows={3} placeholder="Condiciones del día, sensaciones, mejoras..." value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} style={{resize:'vertical',minHeight:'70px'}}/>
            </div>
            <button className="btn btn-primary" onClick={save} style={{width:'100%',justifyContent:'center'}}>
              💾 GUARDAR SETUP
            </button>
          </div>
        </div>
        <div>
          <div style={{fontFamily:'Share Tech Mono',fontSize:'10px',letterSpacing:'2px',color:'var(--text-secondary)',marginBottom:'12px'}}>
            {setups.length} SETUP{setups.length !== 1 ? 'S' : ''} GUARDADO{setups.length !== 1 ? 'S' : ''}
          </div>
          {setups.length === 0 ? (
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'200px',color:'var(--text-secondary)',fontFamily:'Share Tech Mono',letterSpacing:'2px',fontSize:'11px',gap:'12px',border:'1px dashed var(--border)'}}>
              <span style={{fontSize:'40px',opacity:0.3}}>💾</span>
              <span>NO HAY SETUPS GUARDADOS</span>
            </div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:'8px',maxHeight:'75vh',overflowY:'auto',paddingRight:'4px'}}>
              {setups.slice().reverse().map(s => {
                const moto = MOTOS.find(m => m.id === s.motoId);
                const circ = CIRCUITS.find(c => c.id === s.circuitId);
                return (
                  <div key={s.id} className="setup-saved-card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
                      <div>
                        <div style={{fontWeight:'700',fontSize:'15px',letterSpacing:'0.5px'}}>{s.nombre}</div>
                        <div style={{fontFamily:'Share Tech Mono',fontSize:'10px',color:'var(--text-secondary)',marginTop:'2px'}}>{s.fecha}</div>
                      </div>
                      <div style={{display:'flex',gap:'6px'}}>
                        <button className="btn btn-secondary" style={{padding:'4px 10px',fontSize:'9px'}} onClick={()=>exportar(s)}>⬇ EXP</button>
                        <button className="btn" style={{padding:'4px 10px',fontSize:'9px',background:'rgba(232,0,28,0.1)',color:'var(--red)',border:'1px solid var(--red-dim)'}} onClick={()=>del(s.id)}>✕</button>
                      </div>
                    </div>
                    <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'8px'}}>
                      {moto && <span className="badge badge-orange">{moto.marca} {moto.modelo}</span>}
                      {circ && <span className="badge badge-red">{circ.nombre}</span>}
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px'}}>
                      {[
                        {l:'DEL',v:s.presionDel?`${s.presionDel}b`:'—'},
                        {l:'TRAS',v:s.presionTras?`${s.presionTras}b`:'—'},
                        {l:'CDE',v:s.compDel||'—'},
                        {l:'RDE',v:s.reboteDel||'—'},
                      ].map(x=>(
                        <div key={x.l} style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',padding:'6px',textAlign:'center'}}>
                          <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--text-secondary)',letterSpacing:'1px'}}>{x.l}</div>
                          <div style={{fontFamily:'Share Tech Mono',fontSize:'13px',color:'var(--orange)',marginTop:'2px'}}>{x.v}</div>
                        </div>
                      ))}
                    </div>
                    {s.notas && <div style={{marginTop:'8px',fontSize:'12px',color:'var(--text-secondary)',fontStyle:'italic',lineHeight:'1.4'}}>{s.notas}</div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

const SEV_CONFIG = {
  info:    { label: 'INFO',    bg: 'rgba(0,207,255,0.08)',  border: 'rgba(0,207,255,0.3)',  text: 'var(--cyan)' },
  warning: { label: 'ATENCION', bg: 'rgba(255,140,0,0.08)', border: 'rgba(255,140,0,0.3)',  text: 'var(--orange)' },
  critico: { label: 'CRITICO', bg: 'rgba(255,45,68,0.08)',  border: 'rgba(255,45,68,0.35)', text: 'var(--red)' },
};

const TipoBadge = ({ tipo }) => {
  const cfg = { ajuste:'var(--cyan)', cambio:'var(--orange)', tecnica:'var(--green)', critico:'var(--red)' };
  const lbl = { ajuste:'AJUSTE', cambio:'CAMBIO', tecnica:'TECNICA', critico:'CRITICO' };
  return (
    <span style={{display:'inline-block',fontFamily:'Share Tech Mono',fontSize:'8px',
      color: cfg[tipo]||'var(--text-secondary)', border:'1px solid '+(cfg[tipo]||'var(--border)'),
      padding:'1px 5px',letterSpacing:'0.5px',marginRight:'6px',flexShrink:0}}>
      {lbl[tipo]||tipo.toUpperCase()}
    </span>
  );
};

const DiagnosticCard = ({ problem, expanded, onToggle }) => {
  const sev = SEV_CONFIG[problem.severidad];
  return (
    <div style={{border:'1px solid '+(problem.sustituir ? 'var(--red)' : sev.border),
      background: problem.sustituir ? 'rgba(255,45,68,0.05)' : sev.bg,
      marginBottom:'10px', cursor:'pointer', transition:'all 0.2s'}}
      onClick={onToggle}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:'12px',padding:'14px 16px'}}>
        <span style={{fontSize:'22px',flexShrink:0}}>{problem.icono}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap',marginBottom:'3px'}}>
            <span style={{fontFamily:'Orbitron',fontSize:'11px',fontWeight:'700',
              color:problem.sustituir?'var(--red)':sev.text,letterSpacing:'1px'}}>
              {problem.nombre}
            </span>
            {problem.sustituir && (
              <span style={{fontFamily:'Share Tech Mono',fontSize:'8px',background:'var(--red)',
                color:'#fff',padding:'2px 6px',letterSpacing:'1px',fontWeight:'700'}}>
                SUSTITUIR YA
              </span>
            )}
          </div>
          <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--text-secondary)',letterSpacing:'1px'}}>
            {BLOQUES[problem.bloque].icon} {BLOQUES[problem.bloque].label} &nbsp;·&nbsp; ZONA: {problem.zona.toUpperCase()}
          </div>
        </div>
        <span style={{fontFamily:'Share Tech Mono',fontSize:'12px',color:'var(--text-secondary)',flexShrink:0}}>
          {expanded ? '▲' : '▼'}
        </span>
      </div>

      {/* Body */}
      {expanded && (
        <div style={{borderTop:'1px solid var(--border)',padding:'16px'}} onClick={e=>e.stopPropagation()}>
          {/* Sintomas */}
          <div style={{marginBottom:'14px'}}>
            <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:sev.text,letterSpacing:'2px',marginBottom:'6px'}}>SINTOMAS VISUALES</div>
            <div style={{fontFamily:'Rajdhani',fontSize:'14px',color:'var(--text-primary)',lineHeight:'1.6',
              background:'rgba(0,0,0,0.2)',padding:'10px 12px',borderLeft:'3px solid '+sev.text}}>
              {problem.sintomas}
            </div>
          </div>

          {/* Causas */}
          <div style={{marginBottom:'14px'}}>
            <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--text-secondary)',letterSpacing:'2px',marginBottom:'8px'}}>CAUSAS PROBABLES</div>
            <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
              {problem.causas.map((c,i) => (
                <div key={i} style={{display:'flex',gap:'8px',fontFamily:'Rajdhani',fontSize:'13px',color:'var(--text-secondary)',lineHeight:'1.4'}}>
                  <span style={{color:'var(--text-dim)',flexShrink:0,fontFamily:'Share Tech Mono',fontSize:'9px',marginTop:'3px'}}>{String(i+1).padStart(2,'0')}</span>
                  <span>{c}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Soluciones */}
          <div>
            <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--green)',letterSpacing:'2px',marginBottom:'8px'}}>ACCIONES CORRECTIVAS</div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {problem.soluciones.map((s,i) => (
                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:'8px',
                  background: s.tipo==='critico' ? 'rgba(255,45,68,0.08)' : 'rgba(0,0,0,0.15)',
                  border: s.tipo==='critico' ? '1px solid rgba(255,45,68,0.3)' : '1px solid var(--border)',
                  padding:'8px 10px'}}>
                  <TipoBadge tipo={s.tipo}/>
                  <span style={{fontFamily:'Rajdhani',fontSize:'13px',
                    color: s.tipo==='critico' ? 'var(--red)' : 'var(--text-primary)',lineHeight:'1.4',fontWeight: s.tipo==='critico'?'700':'400'}}>
                    {s.accion}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const TireDiag = () => {
  const [bloque,    setBloque]    = useState('todos');
  const [expanded,  setExpanded]  = useState(null);
  const [busqueda,  setBusqueda]  = useState('');

  const bloqueKeys = ['todos', ...Object.keys(BLOQUES)];
  const filtrados = TIRE_PROBLEMS.filter(p => {
    const matchBloque = bloque === 'todos' || p.bloque === bloque;
    const q = busqueda.toLowerCase();
    const matchBusqueda = !q || p.nombre.toLowerCase().includes(q) || p.sintomas.toLowerCase().includes(q) || p.zona.toLowerCase().includes(q);
    return matchBloque && matchBusqueda;
  });

  const criticos = TIRE_PROBLEMS.filter(p => p.sustituir);

  return (
    <div className="page-content fade-in">
      <div style={{fontFamily:'Orbitron',fontSize:'14px',fontWeight:'700',letterSpacing:'3px',color:'var(--text-secondary)',marginBottom:'4px'}}>DIAGNOSTICO — PROBLEMAS NEUMATICOS</div>
      <div style={{fontFamily:'Rajdhani',fontSize:'13px',color:'var(--text-secondary)',marginBottom:'20px',lineHeight:'1.5'}}>
        Guia tecnica de diagnostico visual basada en protocolos Michelin MotoGP / Pirelli Superbike.
        Identifica el problema por sus sintomas y aplica la correccion exacta.
      </div>

      {/* Alerta criticos */}
      <div style={{background:'rgba(255,45,68,0.07)',border:'1px solid rgba(255,45,68,0.4)',padding:'12px 16px',marginBottom:'20px'}}>
        <div style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--red)',letterSpacing:'2px',marginBottom:'8px'}}>DANOS QUE REQUIEREN SUSTITUCION INMEDIATA</div>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
          {criticos.map(p => (
            <button key={p.id}
              onClick={() => { setBloque('todos'); setExpanded(p.id); setTimeout(() => { document.getElementById('diag-'+p.id)?.scrollIntoView({behavior:'smooth',block:'center'}); }, 100); }}
              style={{fontFamily:'Share Tech Mono',fontSize:'10px',background:'rgba(255,45,68,0.15)',
                border:'1px solid var(--red)',color:'var(--red)',padding:'4px 10px',cursor:'pointer',
                letterSpacing:'0.5px',display:'flex',alignItems:'center',gap:'5px'}}>
              {p.icono} {p.nombre}
            </button>
          ))}
        </div>
      </div>

      {/* Search */}
      <div style={{display:'flex',gap:'8px',marginBottom:'14px',alignItems:'center'}}>
        <input
          type="text"
          className="input-field"
          placeholder="Buscar por sintoma, zona o problema..."
          value={busqueda}
          onChange={e => setBusqueda(e.target.value)}
          style={{flex:1,fontSize:'12px'}}
        />
        {busqueda && (
          <button className="btn btn-ghost" style={{fontSize:'11px',padding:'8px 12px'}} onClick={() => setBusqueda('')}>✕</button>
        )}
      </div>

      {/* Bloque filter */}
      <div style={{display:'flex',gap:'6px',marginBottom:'16px',flexWrap:'wrap'}}>
        {bloqueKeys.map(k => {
          const b = BLOQUES[k];
          const count = k === 'todos' ? TIRE_PROBLEMS.length : TIRE_PROBLEMS.filter(p => p.bloque===k).length;
          return (
            <button key={k}
              onClick={() => { setBloque(k); setExpanded(null); }}
              className={'btn '+(bloque===k ? 'btn-secondary' : 'btn-ghost')}
              style={{fontSize:'11px',padding:'7px 13px',gap:'5px',borderColor: bloque===k ? (b?.color||'var(--yellow)') : 'var(--border-bright)'}}>
              {b ? b.icon+' '+b.label : '◈ TODOS'}
              <span style={{fontFamily:'Share Tech Mono',fontSize:'9px',
                background:'rgba(255,255,255,0.08)',padding:'1px 5px',marginLeft:'4px'}}>
                {count}
              </span>
            </button>
          );
        })}
      </div>

      {/* Cards */}
      {busqueda && filtrados.length === 0 && (
        <div style={{textAlign:'center',padding:'40px',color:'var(--text-secondary)',fontFamily:'Share Tech Mono',fontSize:'11px',letterSpacing:'2px'}}>
          SIN RESULTADOS PARA "{busqueda.toUpperCase()}"
        </div>
      )}

      {bloqueKeys.filter(k => k !== 'todos' && (bloque === 'todos' || bloque === k)).map(k => {
        const grupo = filtrados.filter(p => p.bloque === k);
        if (!grupo.length) return null;
        const b = BLOQUES[k];
        return (
          <div key={k} style={{marginBottom:'8px'}}>
            {bloque === 'todos' && (
              <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px',paddingBottom:'8px',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontSize:'16px'}}>{b.icon}</span>
                <span style={{fontFamily:'Orbitron',fontSize:'11px',fontWeight:'700',letterSpacing:'2px',color:b.color}}>{b.label}</span>
                <span style={{fontFamily:'Share Tech Mono',fontSize:'9px',color:'var(--text-dim)'}}>({grupo.length} problemas)</span>
              </div>
            )}
            {grupo.map(p => (
              <div key={p.id} id={'diag-'+p.id}>
                <DiagnosticCard
                  problem={p}
                  expanded={expanded === p.id}
                  onToggle={() => setExpanded(expanded === p.id ? null : p.id)}
                />
              </div>
            ))}
          </div>
        );
      })}

      {/* Footer */}
      <div style={{marginTop:'8px',padding:'12px 14px',background:'rgba(160,173,196,0.04)',border:'1px solid var(--border)',fontFamily:'Rajdhani',fontSize:'12px',color:'var(--text-secondary)',lineHeight:'1.6'}}>
        <strong style={{color:'var(--yellow)',fontFamily:'Share Tech Mono',fontSize:'9px',display:'block',marginBottom:'4px'}}>NOTA TECNICA</strong>
        Este diagnostico es orientativo. Los sintomas descritos son los mas comunes pero pueden variar segun el modelo de neumatico, las condiciones de pista y el estilo de conduccion.
        Ante cualquier duda sobre la seguridad del neumatico, consulta siempre con el tecnico de tu equipo o el representante tecnico del fabricante. Un neumatico en mal estado
        puede causar perdida total de control a alta velocidad.
      </div>
    </div>
  );
};
